# FR3C Jool SCANsat capture profile.
# Ambitious follow-up to the flyby: capture into a high polar Jool orbit,
# release the mapper, and leave it operating. Auto-deorbit is disabled
# because Jool has no solid surface to dispose into.
#
# VAB setup:
#   SCANsat CPU probe core CORE:TAG = "scansat".
#   Decoupler between SCANsat and carrier: part tag "scansat_decoupler".
#
# Select from the FR3C launch-pad mission picker, or set:
#   stateSet("mission_id", "jool_scansat_capture").

MISSION_ID = jool_scansat_capture
MISSION_NAME = Jool SCANsat Capture
TARGET = JOOL
PAYLOADS = SCANSAT
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,XING,BPLANE,COAST_1HALF,REFINE_BPLANE,COAST_2HALF,CAPTURE,SHAPE,SCANSAT_OPS,DONE

PARKING_ALT = 85000
LAUNCH_INCLINATION = 0

# Jool atmosphere ends at 200 km. Capture high and polar: cheap enough
# to survive first arrival, useful for broad coverage, and easy to tune
# later once we know the actual arrival energy.
CAPTURE_PE = 250000
CAPTURE_INC = 90
CAPTURE_DIR = POLAR
TARGET_PE = 250000
TARGET_AP = 15000000

SHAPE_PE = 250000
SHAPE_AP = 15000000
SHAPE_INC = 90

SCANSAT_DECOUPLER_TAG = scansat_decoupler
SCANSAT_DISPOSE_CARRIER = 0
SCANSAT_AUTO_DEORBIT = 0
SCANSAT_POWER_GUARD = 1
SCANSAT_POWER_LOW = 0.30
SCANSAT_POWER_RESUME = 0.60
SOLAR_REORIENT_PERIOD = 43200
