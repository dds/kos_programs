# FR3C Jool flyby probe.
# Non-capturing Jool pass. This is the low-commitment reconnaissance
# profile before spending capture dV on the SCANsat mission.
#
# Select from the FR3C launch-pad mission picker, or set:
#   stateSet("mission_id", "jool_flyby_probe").

MISSION_ID = jool_flyby_probe
MISSION_NAME = Jool Flyby Probe
TARGET = JOOL
PAYLOADS = PROBE
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,XING,BPLANE,COAST_1HALF,REFINE_BPLANE,COAST_2HALF,FLYBY,DONE

PARKING_ALT = 85000
LAUNCH_INCLINATION = 0

# Jool atmosphere ends at 200 km; keep a 50 km buffer.
CAPTURE_PE = 250000

FLYBY_POST_PE_HOLD = 14400
FLYBY_EXIT_SOI = 0
KEEP_WARP = 1
