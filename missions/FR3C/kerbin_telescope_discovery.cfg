# FR3C Kerbin TB-75M Telescope — object discovery station.
# Delivers the telescope to a 600 x 600 km circular equatorial orbit,
# then holds station. No payload separation: the FR3C carrier is the
# bus; the telescope stays attached. RELAY_OPS orients for solar and
# reports on-station so you can warp away and let it run.
#
# VAB setup: same two-core arrangement as the SCANsat mission. The
# stage2_deorbit CPU will reach its Pe > 220 km checkpoint, snapshot
# mass, and then sit dormant (no separation happens on this mission).
# To deorbit the station at end-of-life, run:
#   RUNPATH("0:/cmd/stage2deorbit.ks").
#
# Select from the FR3C launch-pad mission picker, or set:
#   stateSet("mission_id", "kerbin_telescope_discovery").

MISSION_ID = kerbin_telescope_discovery
MISSION_NAME = Kerbin TB-75M Telescope Discovery
TARGET = KERBIN
PAYLOADS = SCISAT
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,CIRC,RAISE,INCLINE,RELAY_OPS,DONE

PARKING_ALT = 85000
# Near-equatorial orbit for maximum solar panel output and short eclipse
# passes — the TB-75M draws power continuously while scanning. 600 km
# is high enough for a long orbital lifetime without drag concern and
# spends less time in Kerbin's shadow than lower orbits. Inclination 0
# keeps the ground track near-equatorial; asteroid tracks cross all
# latitudes so discovery rate is unaffected by inclination in stock KSP.
LAUNCH_INCLINATION = 0
TARGET_PE = 600000
TARGET_AP = 600000
TARGET_INCLINATION = 0
