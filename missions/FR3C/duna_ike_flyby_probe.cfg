# FR3C Duna/Ike flyby probe.
# This profile targets a non-capturing Duna encounter and holds after
# periapsis for operator review/science. The Ike follow-up should be
# planned after the Duna pass once the patched conics are real. If
# you capture into a stable Duna orbit first, the generic router can
# set up the Ike leg:
#   RUNPATH("0:/cmd/goto.ks", LEX("dest", "Ike", "pe", 25000, "reboot", TRUE)).
#
# Select from the FR3C launch-pad mission picker, or set:
#   stateSet("mission_id", "duna_ike_flyby_probe").

MISSION_ID = duna_ike_flyby_probe
MISSION_NAME = Duna/Ike Flyby Probe
TARGET = DUNA
PAYLOADS = PROBE
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,XING,BPLANE,COAST_1HALF,REFINE_BPLANE,COAST_2HALF,FLYBY,DONE

PARKING_ALT = 85000
LAUNCH_INCLINATION = 0

# Duna atmosphere ends at 50 km. Aim above it for a clean science pass
# with enough margin for B-plane correction error.
CAPTURE_PE = 85000

# Stay awake through periapsis plus two hours for instruments/log review.
FLYBY_POST_PE_HOLD = 7200
FLYBY_EXIT_SOI = 0
KEEP_WARP = 1
