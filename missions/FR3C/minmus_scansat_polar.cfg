# FR3C Minmus SCANsat polar mapper.
# Second Minmus campaign mission: map low-res altimetry, low-res
# resources, and biomes before committing landers and crew.
#
# VAB setup:
#   SCANsat CPU probe core CORE:TAG = "scansat".
#   Decoupler between SCANsat and carrier: part tag "scansat_decoupler".
#
# Select from the FR3C launch-pad mission picker, or set:
#   stateSet("mission_id", "minmus_scansat_polar").

MISSION_ID = minmus_scansat_polar
MISSION_NAME = Minmus SCANsat Polar Mapper
TARGET = MINMUS
PAYLOADS = SCANSAT
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,XING,BPLANE,COAST,CAPTURE,SHAPE,SCANSAT_OPS,DONE

PARKING_ALT = 85000
LAUNCH_INCLINATION = 0

CAPTURE_PE = 15000
CAPTURE_INC = 90
CAPTURE_DIR = POLAR
TARGET_PE = 75000
TARGET_AP = 75000

SHAPE_PE = 75000
SHAPE_AP = 75000
SHAPE_INC = 90

SCANSAT_DECOUPLER_TAG = scansat_decoupler
SCANSAT_DISPOSE_CARRIER = 0
SCANSAT_AUTO_DEORBIT = 1
SCANSAT_TARGET_COVERAGE = 99.1
SCANSAT_REQUIRED_TYPES = LOW_RES_ALTIMETRY,LOW_RES_RESOURCES,BIOME
SCANSAT_DEORBIT_PE = 0
SCANSAT_DEORBIT_MAX_TIME = 600
SCANSAT_POWER_LOW = 0.30
SCANSAT_POWER_RESUME = 0.60
SOLAR_REORIENT_PERIOD = 21600
