# FR3C Kerbin SCANsat polar mapper at 249 km - stage returns to KSC.
# SCANsat core (CORE:TAG = "scansat") is the primary mission CPU:
# ascent, orbit shaping, SCANsat release, mapping, then self-disposal
# by impact after the required maps exceed 99% coverage.
# Stage return core (CORE:TAG = "stage2_deorbit") stays quiet until
# the mapper separates, then flies KSC_DEORBIT + DESCENT home.
#
# VAB setup (three tagged items):
#   SCANsat CPU probe core CORE:TAG = "scansat"  - primary mission computer.
#   Stage CPU probe core   CORE:TAG = "stage2_deorbit" - return-only computer.
#   Decoupler between SCANsat and stage: part tag "scansat_decoupler".
#
# Select from the FR3C launch-pad mission picker, or set:
#   stateSet("mission_id", "kerbin_scansat_249").

MISSION_ID = kerbin_scansat_249
MISSION_NAME = Kerbin SCANsat 249 km Mapper
TARGET = KERBIN
PAYLOADS = SCANSAT
# The primary mapper CPU stops at SCANSAT_OPS. The secondary
# stage2_deorbit CPU owns the KSC return after separation.
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,RAISE,CIRC,INCLINE,SCANSAT_OPS,DONE

PARKING_ALT = 85000
# Polar orbit: every latitude gets equal pass density as Kerbin rotates
# beneath the fixed orbit plane, maximising total surface coverage per unit
# time. 249 km sits at the top of the SCANsat best-coverage band for
# most altimetry/biome scanners (~200-250 km ideal for Kerbin) while
# staying well below the high-altitude mapping band (~500 km+).
LAUNCH_INCLINATION = 90
TARGET_PE = 249000
TARGET_AP = 249000
TARGET_INCLINATION = 90

# SCANsat release at target orbit; mapper continues into autonomous mapping.
SCANSAT_DECOUPLER_TAG = scansat_decoupler
SCANSAT_DISPOSE_CARRIER = 0
SCANSAT_AUTO_DEORBIT = 1
SCANSAT_TARGET_COVERAGE = 99.1
SCANSAT_REQUIRED_TYPES = LOW_RES_ALTIMETRY,LOW_RES_RESOURCES,BIOME
SCANSAT_DEORBIT_PE = 30000
SCANSAT_DEORBIT_MAX_TIME = 600
SCANSAT_POWER_LOW = 0.30
SCANSAT_POWER_RESUME = 0.60

# KSC deorbit return leg for the stage2_deorbit secondary core.
# Descent libs pre-synced at the pad so reentry never waits on a KSC
# link. 300 s lead: time to despin and align a polar-orbit stage
# before the burn.
# 10-orbit scan window: from 90 deg polar each orbit shifts the ground
# track ~21.5 deg, so 10 orbits covers ~215 deg of longitude spread
# (early-stop on first pass within 40 km of KSC).
LIBS_EXTRA = descent
LANDING_TARGET_LAT = -0.10
LANDING_TARGET_LNG = -74.25
LANDING_TARGET_TOLERANCE = 15000
REENTRY_PE = 30000
TARGET_DEORBIT_SCAN_ORBITS = 10
TARGET_DEORBIT_SCAN_SAMPLES = 320
TARGET_DEORBIT_COARSE_STOP_DIST = 40000
TARGET_DEORBIT_SKIP_REFINE = 1
TARGET_DEORBIT_PROCEED_ON_MISS = 1
TARGET_DEORBIT_MIN_LEAD = 300

# Ride the whole remaining stack down (engine + fuel + decoupler stub).
# Tag a separator and set DESCENT_DECOUPLE_ALT if the vehicle needs to
# shed mass before chute deployment; otherwise the default "none" keeps
# everything together.
DESCENT_RELEASE_ALT = 38000
