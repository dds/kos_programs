# FR3C Kerbin SCANsat polar mapper at 249 km — stage returns to KSC.
# Stage2 core (CORE:TAG = "stage2", no roles/stage2.ks) boots via the
# vehicle-name fallback into craft/FR3C.ks and flies the full mission:
# ascent, orbit shaping, SCANsat release, then deorbits itself and
# lands back at KSC. SCANsat core (CORE:TAG = "scansat") runs
# roles/scansat.ks: dormant until separated, then manages the scanner
# and deorbits itself when the operator runs cmd/scansatdeorbit.ks.
#
# VAB setup (three tagged items):
#   Stage CPU probe core  CORE:TAG = "stage2"    — main computer; returns to KSC.
#   SCANsat CPU probe core CORE:TAG = "scansat"  — dormant during ascent; scanner
#                                                  brain post-separation.
#   Decoupler between SCANsat and stage: part tag "scansat_decoupler".
#
#   The two CPUs will NOT fight: "stage2" has no role script so boot
#   falls through to craft/FR3C.ks; "scansat" routes to roles/scansat.ks
#   which never touches STEERING or THROTTLE before separation.
#
# Select from the FR3C launch-pad mission picker, or set:
#   stateSet("mission_id", "kerbin_scansat_249").

MISSION_ID = kerbin_scansat_249
MISSION_NAME = Kerbin SCANsat 249 km Mapper
TARGET = KERBIN
PAYLOADS = SCANSAT
# After SCANSAT_OPS the stage flies KSC_DEORBIT + DESCENT home.
# No SCANSAT_POWER_GUARD: _scanSatOnStation() runs orientForSolar()
# and returns immediately so the phase machine can advance to KSC_DEORBIT.
# The scansat role (on the SCANsat CPU) manages its own power independently.
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,CIRC,RAISE,INCLINE,SCANSAT_OPS,KSC_DEORBIT,DESCENT,DONE

PARKING_ALT = 85000
# Polar orbit: every latitude gets equal pass density as Kerbin rotates
# beneath the fixed orbit plane, maximising total surface coverage per unit
# time. 249 km sits at the top of the SCANsat best-coverage band for
# most altimetry/biome scanners (~200-250 km ideal for Kerbin) while
# staying well below the high-altitude mapping band (~500 km+).
LAUNCH_INCLINATION = 90
TARGET_PE = 249000
TARGET_AP = 249000
TARGET_INCLINATION = 90

# SCANsat release at target orbit; stage advances to KSC_DEORBIT immediately.
SCANSAT_DECOUPLER_TAG = scansat_decoupler
SCANSAT_DISPOSE_CARRIER = 0

# KSC deorbit return leg. Descent libs pre-synced at the pad so reentry
# never waits on a KSC link. 300 s lead: time to despin and align a
# polar-orbit stage before the burn (flight-found on the scansat).
# 10-orbit scan window: from 90 deg polar each orbit shifts the ground
# track ~21.5 deg, so 10 orbits covers ~215 deg of longitude spread
# (early-stop on first pass within 40 km of KSC).
LIBS_EXTRA = descent
LANDING_TARGET_LAT = -0.10
LANDING_TARGET_LNG = -74.25
LANDING_TARGET_TOLERANCE = 15000
REENTRY_PE = 30000
TARGET_DEORBIT_SCAN_ORBITS = 10
TARGET_DEORBIT_SCAN_SAMPLES = 320
TARGET_DEORBIT_COARSE_STOP_DIST = 40000
TARGET_DEORBIT_SKIP_REFINE = 1
TARGET_DEORBIT_PROCEED_ON_MISS = 1
TARGET_DEORBIT_MIN_LEAD = 300

# Ride the whole remaining stack down (engine + fuel + decoupler stub).
# Tag a separator and set DESCENT_DECOUPLE_ALT if the vehicle needs to
# shed mass before chute deployment; otherwise the default "none" keeps
# everything together.
DESCENT_RELEASE_ALT = 38000
