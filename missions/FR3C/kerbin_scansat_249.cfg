# FR3C Kerbin SCANsat polar mapper at 249 km.
# Ascent to parking orbit, raise and trim to 249 x 249 km polar,
# release the SCANsat, then power-guard duty cycle on the mapper.
# The second stage deorbits itself autonomously via roles/stage2_deorbit.ks.
#
# VAB setup (three tagged items, everything else is cosmetic):
#   Main CPU probe core   CORE:TAG = ""  (blank)  — stays with SCANsat;
#                                                    flies the full mission.
#   Stage CPU probe core  CORE:TAG = "stage2_deorbit"  — dormant during
#                                                    flight; burns retrograde
#                                                    ~30 s after payload release.
#   Decoupler between SCANsat and second stage: part tag "scansat_decoupler".
#
#   SCANsat must be >= 0.15 t (mass-drop separation threshold in the role).
#   The two CPUs will NOT fight for control provided the tags above are set.
#
# Select from the FR3C launch-pad mission picker, or set:
#   stateSet("mission_id", "kerbin_scansat_249").

MISSION_ID = kerbin_scansat_249
MISSION_NAME = Kerbin SCANsat 249 km Mapper
TARGET = KERBIN
PAYLOADS = SCANSAT
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,CIRC,RAISE,INCLINE,SCANSAT_OPS,DONE

PARKING_ALT = 85000
# Polar orbit: every latitude gets equal pass density as Kerbin rotates
# beneath the fixed orbit plane, maximising total surface coverage per unit
# time. 249 km sits at the top of the SCANsat best-coverage band for
# most altimetry/biome scanners (~200-250 km ideal for Kerbin) while
# staying well below the high-altitude mapping band (~500 km+).
LAUNCH_INCLINATION = 90
TARGET_PE = 249000
TARGET_AP = 249000
TARGET_INCLINATION = 90

# Power-guard duty cycle: scanners off below 30% EC, back on above 60%.
# orientForSolar() holds the best measured solar attitude between cycles.
# Warp 5-10x and let it grind out the map; AG10 ends the cycle.
SCANSAT_POWER_GUARD = 1
SCANSAT_POWER_LOW = 0.30
SCANSAT_POWER_RESUME = 0.60

# Release the SCANsat at the target orbit. The main CPU (on the SCANsat)
# calls _scanSatOnStation() and then DONE. The stage CPU fires its own
# deorbit burn automatically — no SCANSAT_DISPOSE_CARRIER burn here.
SCANSAT_DECOUPLER_TAG = scansat_decoupler
SCANSAT_DISPOSE_CARRIER = 0
