# Falcon in-orbit rendezvous around the current parent body.
# Use this after both vessels are already orbiting the same body.
# The RDV planner will hold if RENDEZVOUS_TARGET is not around the
# same parent as the active Falcon.

MISSION_ID = rendezvous_around_parent
MISSION_NAME = Rendezvous Around Parent
TARGET = KERBIN
PAYLOADS = CREW
SEQUENCE = RDV,MATCH,DONE

RENDEZVOUS_TARGET = Falcon
MATCH_FINAL_DIST = 150
LIBS_EXTRA = solar

