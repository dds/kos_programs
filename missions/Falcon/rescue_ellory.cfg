# Falcon LKO rescue — recover Ellory from "Ellory's Wreckage" and
# bring him home to KSC.
#
# Launch the Falcon EMPTY (no crew) so the Mk1 pod has a free seat.
# Target "Ellory's Wreckage" in MAP VIEW before launching — the wreck
# name has an apostrophe/space, so we take the game target rather than
# hardcode RENDEZVOUS_TARGET. PRELAUNCH grabs and persists it, then
# waits for the launch window; RDV plans the Hohmann catch-up, MATCH
# brakes and closes to ~150 m (EVA range); CREW_XFER holds until Ellory
# boards. Then the KSC deorbit + descent recipe brings everyone home.
#
# Knobs: LAUNCH_RDV_LEAD (deg ahead of the site at insertion, 30),
# LAUNCH_RDV_ASCENT_TIME (300s), LAUNCH_RDV_MAX_WINDOWS (16),
# MATCH_FINAL_DIST (150m).

MISSION_ID = rescue_ellory
MISSION_NAME = Ellory Rescue
TARGET = KERBIN
PAYLOADS = CREW
SEQUENCE = PRELAUNCH,LAUNCH,ANTS,PARK,RDV,MATCH,CREW_XFER,KSC_DEORBIT,DESCENT,DONE

PARKING_ALT = 74000
# RENDEZVOUS_TARGET = Ellory's Wreckage   (prefer targeting in map view)

# launch: ascent must start the moment the rendezvous window opens.
# descent: crewed reentry must never wait on a KSC link for its libs.
LIBS_EXTRA = launch@PARK, descent

LAUNCH_RDV_ASCENT_TIME = 300
LAUNCH_RDV_LEAD = 30
LAUNCH_RDV_MAX_WINDOWS = 16
MATCH_FINAL_DIST = 150

# Return leg (the landatksc recipe, offshore KSC).
LANDING_TARGET_LAT = -0.10
LANDING_TARGET_LNG = -74.25
LANDING_TARGET_TOLERANCE = 15000
REENTRY_PE = 30000
TARGET_DEORBIT_SCAN_ORBITS = 4
TARGET_DEORBIT_SCAN_SAMPLES = 128
TARGET_DEORBIT_COARSE_STOP_DIST = 15000
TARGET_DEORBIT_SKIP_REFINE = 1
TARGET_DEORBIT_PROCEED_ON_MISS = 1
TARGET_DEORBIT_MIN_LEAD = 90

# Default: ride the whole Mk1 stack down (like falcon_x_lko). If the
# Falcon must shed a stage before chutes, tag it and set
# DESCENT_DECOUPLER_TAG / DESCENT_DECOUPLE_ALT instead.
DESCENT_DECOUPLER_TAG = none
DESCENT_RELEASE_ALT = 38000
