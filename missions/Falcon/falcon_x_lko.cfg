# Falcon-X experimental single-seat LKO shakedown.
# Simple first flight: launch, enter a low Kerbin orbit, hold briefly,
# then use KSC_DEORBIT + DESCENT to come home.
#
# If the vessel is named exactly Falcon-X, boot may parse X as a target
# token. To force this profile explicitly:
#   stateSet("mission_id", "falcon_x_lko").

MISSION_ID = falcon_x_lko
MISSION_NAME = Falcon-X LKO Shakedown
TARGET = KERBIN
PAYLOADS = CREW
SEQUENCE = LAUNCH,ANTS,PARK,KSC_DEORBIT,DESCENT,DONE

PARKING_ALT = 74000
LAUNCH_INCLINATION = 28

# Keep the first flight short: 10 minutes from orbit insertion,
# then return on the next acceptable KSC pass.
ORBIT_STAY_TIME = 600

# Pre-sync the descent band at the pad; crewed reentry should not
# depend on a live KSC link during entry.
LIBS_EXTRA = descent

LANDING_TARGET_LAT = -0.10
LANDING_TARGET_LNG = -74.25
LANDING_TARGET_TOLERANCE = 15000
REENTRY_PE = 30000
TARGET_DEORBIT_SCAN_ORBITS = 8
TARGET_DEORBIT_SCAN_SAMPLES = 128
TARGET_DEORBIT_COARSE_STOP_DIST = 15000
TARGET_DEORBIT_SKIP_REFINE = 1
TARGET_DEORBIT_PROCEED_ON_MISS = 1
TARGET_DEORBIT_MIN_LEAD = 300

# Shed the service module before peak dynamic pressure so the pod can
# stabilize blunt-end-first instead of the full stack weathercocking
# prograde in the mid-atmosphere.
DESCENT_DECOUPLER_TAG = descent_decoupler
DESCENT_DECOUPLE_ALT = 42000
DESCENT_CHUTES_TAG = descent_chutes
DESCENT_RELEASE_ALT = 38000
DESCENT_HEAT_SHIELD_DROP_ALT = 30
DESCENT_BAY_REOPEN_ALT = 42000
