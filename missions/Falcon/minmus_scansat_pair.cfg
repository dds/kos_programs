# Falcon-Minmus-SCANSat-2.
# One Falcon stack sends a detachable radar-altimetry relay sat to
# 70 km x 70 km @ 75 deg, then leaves the integrated bus/Sat 2 in
# 300 km x 300 km polar orbit for multispectral SCANsat operations.
#
# VAB setup:
#   Main mission CPU is on the Sat 2/bus vessel.
#   Sat 1 secondary CPU CORE:TAG = "zombie".
#   Sat 1 decoupler tag: relay_scan_1_decoupler.
#   Sat 1 antenna tag: relay_scan_1_ant.
#   Sat 1 solar tag: relay_scan_1_sol.
#   Sat 2 antenna tag: relay_scan_2_ant.
#   Sat 2 solar tag: relay_scan_2_sol.
#
# Select from the Falcon launch-pad mission picker, or set:
#   stateSet("mission_id", "minmus_scansat_pair").

MISSION_ID = minmus_scansat_pair
MISSION_NAME = Falcon Minmus SCANSat 2
TARGET = MINMUS
PAYLOADS = SCANSAT
SEQUENCE = PRELAUNCH,LAUNCH,FAIR,ANTS,PARK,XING,BPLANE,COAST_1HALF,REFINE_BPLANE,COAST_2HALF,CAPTURE,SHAPE,DONE

FAIRING_ALT = 73750
EXTEND_ALT = 74000
PARKING_ALT = 77500
LAUNCH_INCLINATION = 0
LAUNCH_PLANE_MODE = BODY_ORBIT

CAPTURE_PE = 10000
CAPTURE_INC = 116.6
CAPTURE_DIR = PROGRADE
TARGET_AP = 500000
TARGET_PE = 10000
TARGET_INCLINATION = 116.6
TARGET_LAN = 278.5
MAX_INCL_CHANGE_DV = 300

SHAPE_PE = 9300
SHAPE_AP = 397272
SHAPE_INC = 116.6
SHAPE_LAN = 278.5
SHAPE_AOP = 90
SHAPE_ALT_TOL = 5000

PAYLOAD_2_ANTENNA_TAG = relay_scan_2_ant
PAYLOAD_2_SOLAR_TAG = relay_scan_2_sol

# Secondary target is loaded after the primary 70 km orbit reaches DONE:
#   RUNPATH("1:/cmd/secondarytarget.ks").
SECONDARY_SEQUENCE = SHAPE,SCANSAT_OPS,DONE
SECONDARY_RELEASE_TAG = relay_scan_1_decoupler
SECONDARY_RELEASE_ANTENNA_TAG = relay_scan_1_ant
SECONDARY_RELEASE_SOLAR_TAG = relay_scan_1_sol
SECONDARY_SHAPE_PE = 350000
SECONDARY_SHAPE_AP = 350000
SECONDARY_SHAPE_INC = 90

# Bus/Sat 2 is the active mission CPU and remains attached. The
# SCANsat phase should manage scanning/power only, not release.
SCANSAT_DECOUPLER_TAG = none
SCANSAT_DISPOSE_CARRIER = 0
SCANSAT_AUTO_DEORBIT = 0
SCANSAT_POWER_GUARD = 1
SCANSAT_TARGET_COVERAGE = 99.1
SCANSAT_REQUIRED_TYPES = MULTISPECTRAL
SCANSAT_POWER_LOW = 0.30
SCANSAT_POWER_RESUME = 0.60
SOLAR_REORIENT_PERIOD = 21600
KEEP_WARP = 1
