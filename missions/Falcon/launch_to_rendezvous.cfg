# Falcon launch-to-rendezvous test.
# All launch vehicles fly as "Falcon" and are renamed once they reach
# parking orbit. This flight is "Tenderheart Bear" (Jeb), rising to meet
# the parked target "Grumpy Bear" (from falcon_lko_target). The rename
# is mandatory: two vessels both named "Falcon" make the RDV/MATCH
# VESSEL() lookup ambiguous. Edit RENDEZVOUS_TARGET for another vessel,
# or set the game target before launch and clear this value.

MISSION_ID = launch_to_rendezvous
MISSION_NAME = Launch to Rendezvous
TARGET = KERBIN
PAYLOADS = CREW
SEQUENCE = PRELAUNCH,LAUNCH,ANTS,PARK,RDV,MATCH,DONE

PARKING_ALT = 74000
RENDEZVOUS_TARGET = Grumpy Bear

# PRELAUNCH waits for the target's orbital plane and along-track
# position, then hands directly to LAUNCH at the window.
LAUNCH_RDV_ASCENT_TIME = 300
LAUNCH_RDV_LEAD = 30
LAUNCH_RDV_MAX_WINDOWS = 16
MATCH_FINAL_DIST = 150
LIBS_EXTRA = launch@PARK, solar

