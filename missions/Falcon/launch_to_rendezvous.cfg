# Falcon launch-to-rendezvous test.
# Target must already be in orbit around Kerbin. By default this
# catches the parked target from falcon_lko_target, which MUST be
# renamed to Falcon-Target on orbit so it is not ambiguous with this
# rescuer (both default to the name "Falcon"). Edit RENDEZVOUS_TARGET
# for another vessel, or set the game target before launch and clear
# this value.

MISSION_ID = launch_to_rendezvous
MISSION_NAME = Launch to Rendezvous
TARGET = KERBIN
PAYLOADS = CREW
SEQUENCE = PRELAUNCH,LAUNCH,ANTS,PARK,RDV,MATCH,DONE

PARKING_ALT = 74000
RENDEZVOUS_TARGET = Falcon-Target

# PRELAUNCH waits for the target's orbital plane and along-track
# position, then hands directly to LAUNCH at the window.
LAUNCH_RDV_ASCENT_TIME = 300
LAUNCH_RDV_LEAD = 30
LAUNCH_RDV_MAX_WINDOWS = 16
MATCH_FINAL_DIST = 150
LIBS_EXTRA = launch@PARK, solar

