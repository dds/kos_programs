# Falcon launch-to-rendezvous test.
# All launch vehicles fly as "Falcon" and are renamed once they reach
# parking orbit. This flight is "Tenderheart Bear" (Jeb), rising to meet
# the parked target "Grumpy Bear" (from falcon_lko_target). The rename
# is mandatory: two vessels both named "Falcon" make the RDV/MATCH
# VESSEL() lookup ambiguous. Edit RENDEZVOUS_TARGET for another vessel,
# or set the game target before launch and clear this value.

MISSION_ID = launch_to_rendezvous
MISSION_NAME = Launch to Rendezvous
TARGET = KERBIN
PAYLOADS = CREW
SEQUENCE = PRELAUNCH,LAUNCH,ANTS,PARK,RDV,MATCH,DONE

PARKING_ALT = 75000
RENDEZVOUS_TARGET = Eilory's Wreckage

# PRELAUNCH waits for the target's orbital plane and along-track
# position, then hands directly to LAUNCH at the window. The lead
# is measured against the launch-site direction at insertion; Falcon
# flies about 58 deg downrange during ascent, so use ~60 deg to park
# just behind an 85 km target from a 75 km parking orbit.
LAUNCH_RDV_ASCENT_TIME = 300
LAUNCH_RDV_LEAD = 70
LAUNCH_RDV_MAX_WINDOWS = 16
MATCH_FINAL_DIST = 150
LIBS_EXTRA = launch@PARK, solar

LANDING_TARGET_LAT = -0.10
LANDING_TARGET_LNG = -74.25
LANDING_TARGET_TOLERANCE = 1000
REENTRY_PE = 30000
LANDING_DEORBIT_BUDGET_DV = 600
TARGET_DEORBIT_SCAN_ORBITS = 8
TARGET_DEORBIT_SCAN_SAMPLES = 128
TARGET_DEORBIT_COARSE_STOP_DIST = 15000
TARGET_DEORBIT_SKIP_REFINE = 1
TARGET_DEORBIT_PROCEED_ON_MISS = 1
TARGET_DEORBIT_MIN_LEAD = 300
DESCENT_DECOUPLE_ALT = 34000
DESCENT_CHUTES_TAG = descent_chutes
DESCENT_RELEASE_ALT = 38000
DESCENT_HEAT_SHIELD_DROP_ALT = -1
DESCENT_BAY_REOPEN_ALT = 42000
DESCENT_SERVICE_ARM_ALT = 60000
DESCENT_SERVICE_SEPARATION_DROP = 0.15
DESCENT_SERVICE_RELEASE_ALT = 500
