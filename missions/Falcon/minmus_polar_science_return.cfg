# Falcon Minmus equatorial science-return scout.
# First low-commitment Minmus science mission: capture into an easy
# prograde equatorial orbit, run onboard science, then hold for review.
# This proves the Minmus transfer/capture/return flow before flying a
# Kerbal or the later polar-plus-surface-probe mission.
#
# After SCIENCE_OPS/DONE, return from stable Minmus orbit:
#   RUNPATH("0:/cmd/returntokerbin.ks").
#
# Select from the Falcon launch-pad mission picker, or set:
#   stateSet("mission_id", "minmus_equatorial_science_return").

MISSION_ID = minmus_polar_science_return
MISSION_NAME = Minmus Polar Science Return
TARGET = MINMUS
PAYLOADS = SCISAT
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,XING,BPLANE,COAST,CAPTURE,SHAPE,SCIENCE_OPS,DONE

PARKING_ALT = 74000
LAUNCH_INCLINATION = 0

CAPTURE_PE = 10000
CAPTURE_INC = 180
CAPTURE_DIR = RETROGRADE
TARGET_PE = 13000
TARGET_AP = 13000
TARGET_INCLINATION = 180
MAX_INCL_CHANGE_DV = 300

EXTEND_ALT = 72000
FAIRING_ALT = 71500

SHAPE_PE = 856737
SHAPE_AP = 1156174
SHAPE_INC = 180
SHAPE_AOP = 23.1

REENTRY_PE = 45000
