# Falcon Minmus polar science-return scout.
# Launches into Minmus's Kerbin-orbit plane, transfers to Minmus,
# captures into the contract orbit, runs onboard science, then holds
# for review.
#
# After SCIENCE_OPS/DONE, return from stable Minmus orbit:
#   RUNPATH("0:/cmd/returntokerbin.ks").
#
# Select from the Falcon launch-pad mission picker, or set:
#   stateSet("mission_id", "minmus_polar_science_return").

MISSION_ID = minmus_polar_science_return
MISSION_NAME = Minmus Polar Science Return
TRANSFER_SCAN_SAMPLES_PER_ORBIT = 16
TARGET = MINMUS
PAYLOADS = SCISAT
SEQUENCE = PRELAUNCH,LAUNCH,FAIR,ANTS,PARK,XING,BPLANE,COAST_1HALF,REFINE_BPLANE,COAST_2HALF,CAPTURE,SHAPE,SCIENCE_OPS,DONE
LIBS_EXTRA = launch@PARK

PARKING_ALT = 74000
LAUNCH_INCLINATION = 0
LAUNCH_PLANE_MODE = BODY_ORBIT

CAPTURE_PE = 10000
CAPTURE_INC = 180
CAPTURE_DIR = RETROGRADE
TARGET_PE = 250000
TARGET_INCLINATION = 180
MAX_INCL_CHANGE_DV = 300

EXTEND_ALT = 72000
FAIRING_ALT = 71500

SHAPE_PE = 856737
SHAPE_AP = 1156174
SHAPE_INC = 180
SHAPE_AOP = 23.1
SHAPE_ALT_TOL = 15000

REENTRY_PE = 45000
LANDING_TARGET_LAT = 0
LANDING_TARGET_LON = -98.39
LANDING_TARGET_TOLERANCE = 1500
LANDING_TARGET_BODY = MINMUS
CARRIER_TIP = FALSE

