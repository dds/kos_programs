# FR3b two-seat pod — crewed LKO flight — the orbital follow-up to the
# flight-proven round-the-world hop. Ascent to a circular parking
# orbit, ORBIT_STAY_TIME in orbit (KAC-alarmed, warp away), then
# the flight-proven landatksc machinery brings the crew home:
# Trajectories-targeted deorbit offshore of KSC, chute DESCENT.
# Band changes auto-reboot — zero-touch after the launch confirm.
#
# VAB prep matches krbcap1_suborbital: chutes on the capsule,
# capsule/booster separator tagged "descent_decoupler".
#
# Select from the FR3 launch-pad mission picker, or set:
#   stateSet("mission_id", "krbcap1_polar_tour").

MISSION_ID = krbcap1_polar_tour
MISSION_NAME = KRBCAP1 Polar Biome Tour
TARGET = KERBIN
PAYLOADS = KRBCAP1
SEQUENCE = LAUNCH,ANTS,PARK,KSC_DEORBIT,DESCENT,DONE

PARKING_ALT = 74000
# 80 deg: the ground track sweeps grasslands, highlands,
# mountains, tundra, and BOTH ice caps twice per orbit — the
# biome announcer in the stay calls each crossing for EVA
# reports. Costs ~170 m/s of rotation assist vs equatorial;
# budgets are measured at runtime, watch the margins.
LAUNCH_INCLINATION = 80

# Pre-sync the descent band at the pad — crewed reentry must
# never wait on a KSC link for its libraries.
LIBS_EXTRA = descent

# Time to spend in orbit before the return leg, in seconds from
# orbit insertion (3 hours = half a Kerbin day; set to taste, 0 =
# return on the first good pass). KAC-alarmed, warp-safe.
ORBIT_STAY_TIME = 10800

# Deorbit targeting. Best pass flies even outside tolerance; the
# coarse pick is polished by the post-burn impact walk.
#
# Land IN the ice: target the northern polar region; the SCANsat
# biome map verifies the spot and hunts nearby (closest-to-pole
# first) if the guess is off, via LANDING_TARGET_BIOMES. Recovery
# value is lower out there — this one is for the science.
LANDING_TARGET_LAT = 78
LANDING_TARGET_LNG = -74
LANDING_TARGET_BIOMES = ice, tundra
LANDING_TARGET_TOLERANCE = 25000

# Drop out of warp when crossing these during the orbit stay
# (substring match): tundra, ice caps, and both ice shelves.
EVA_BIOMES = tundra, ice
REENTRY_PE = 30000
# 14 orbits (~7.5h, KAC-alarmed): a near-polar track passes close
# to KSC's longitude only every few orbits — the wide window lets
# the scan pick a genuinely close pass, and the post-burn impact
# walk nulls the along-track remainder. Expect 20-50km landings;
# cross-track residue is set by pass choice, not the walk.
TARGET_DEORBIT_SCAN_ORBITS = 14
TARGET_DEORBIT_SCAN_SAMPLES = 448
TARGET_DEORBIT_COARSE_STOP_DIST = 15000
TARGET_DEORBIT_SKIP_REFINE = 1
TARGET_DEORBIT_PROCEED_ON_MISS = 1
# 300s lead: time to despin/align before the burn (flight-found
# on the scansat; harmless with a pilot aboard).
TARGET_DEORBIT_MIN_LEAD = 300

# Ride the whole stack down — enough chutes for capsule+booster,
# and the attached booster's science comes home too (the FR3
# craft default of DESCENT_DECOUPLER_TAG = none applies; tag a
# separator and set DESCENT_DECOUPLE_ALT here only if a heavier
# build needs to shed it). Attitude control drops at 38 km to
# save battery (chutes stabilize).
DESCENT_RELEASE_ALT = 38000
