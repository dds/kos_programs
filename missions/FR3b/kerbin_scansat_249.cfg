# FR3b Kerbin SCANsat polar mapper at 249 km.
# Ascent to parking orbit, raise and trim to a 249 x 249 km polar
# orbit, release the mapper, then deorbit the carrier. The power-guard
# duty cycle manages scanner operation on battery EC.
#
# VAB prep: the SCANsat scanner stack must be separated from the carrier
# by a decoupler tagged "scansat_decoupler".
#
# Select from the FR3b launch-pad mission picker, or set:
#   stateSet("mission_id", "kerbin_scansat_249").

MISSION_ID = kerbin_scansat_249
MISSION_NAME = Kerbin SCANsat 249 km Mapper
TARGET = KERBIN
PAYLOADS = SCANSAT
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,RAISE,CIRC,INCLINE,SCANSAT_OPS,DONE

PARKING_ALT = 85000
# Polar orbit: every latitude gets equal pass density as Kerbin rotates
# beneath the fixed orbit plane, maximising total surface coverage per unit
# time. 249 km sits at the top of the SCANsat best-coverage band for
# most altimetry/biome scanners (~200-250 km ideal for Kerbin) while
# staying well below the high-altitude mapping band (~500 km+).
LAUNCH_INCLINATION = 90
TARGET_PE = 249000
TARGET_AP = 249000
TARGET_INCLINATION = 90

# Power-guard duty cycle: scanners off below 30% EC, back on above 60%.
# orientForSolar() holds the best measured solar attitude between cycles.
# Warp 5-10x and let it grind out the map.
SCANSAT_POWER_GUARD = 1
SCANSAT_POWER_LOW = 0.30
SCANSAT_POWER_RESUME = 0.60

# Release the mapper in the target orbit, then deorbit the carrier.
# Clearance nudge pushes the carrier onto its disposal trajectory before
# the retrograde burn so the mapper is not in the exhaust plume.
SCANSAT_DECOUPLER_TAG = scansat_decoupler
SCANSAT_DISPOSE_CARRIER = 1
SCANSAT_DISPOSE_PE = 30000
SCANSAT_DISPOSE_MAX_TIME = 600
SCANSAT_CLEARANCE_DV = 2
SCANSAT_CLEARANCE_DIR = NORMAL
SCANSAT_CLEARANCE_THROTTLE = 0.25
SCANSAT_CLEARANCE_SETTLE = 3
