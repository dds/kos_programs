# FR3 Mun SCANsat fast-follow mission profile.
# Select this from the FR3 launch-pad mission picker, or set:
#   stateSet("mission_id", "mun_scansat_polar").

MISSION_ID = mun_scansat_polar
MISSION_NAME = Mun SCANsat Polar Mapper
TARGET = MUN
PAYLOADS = SCANSAT
PROGRESSIVE_RELOAD = 1

PARKING_ALT = 80000
LAUNCH_INCLINATION = 0
FAIRING_ALT = 71500
EXTEND_ALT = 73000
CAPTURE_PE = 15000
CAPTURE_INC = 90
CAPTURE_DIR = POLAR
TARGET_PE = 75000
TARGET_AP = 75000
TARGET_INCLINATION = 90
MAX_INCL_CHANGE_DV = 300

RELOAD_AFTER_PARK = 1
# This profile is for the current build without an autonomous carrier core:
# burn the combined stack onto an impact Pe, release/stage the mapper,
# then recover the SCANsat to a 75 x 75 km mapping orbit.
SCANSAT_DECOUPLER_TAG = scansat_decoupler
SCANSAT_DISPOSE_CARRIER = 1
SCANSAT_RELEASE_AFTER_CAPTURE = 1
SCANSAT_DISPOSE_BEFORE_RELEASE = 1
SCANSAT_DISPOSE_PE = 2000
SCANSAT_DISPOSE_MAX_TIME = 600
SCANSAT_STAGE_AFTER_RELEASE = 1
SCANSAT_RECOVERY_PE = 75000
SCANSAT_RECOVERY_AP = 75000
