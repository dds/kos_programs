# FR3 + KRBCAP1 crewed LKO flight — the orbital follow-up to the
# flight-proven round-the-world hop. Ascent to a circular parking
# orbit, ORBIT_STAY_TIME in orbit (KAC-alarmed, warp away), then
# the flight-proven landatksc machinery brings the crew home:
# Trajectories-targeted deorbit offshore of KSC, chute DESCENT.
# Band changes auto-reboot — zero-touch after the launch confirm.
#
# VAB prep matches krbcap1_suborbital: chutes on the capsule,
# capsule/booster separator tagged "descent_decoupler".
#
# Select from the FR3 launch-pad mission picker, or set:
#   stateSet("mission_id", "krbcap1_lko").

MISSION_ID = krbcap1_lko
MISSION_NAME = KRBCAP1 LKO Orbit
TARGET = KERBIN
PAYLOADS = KRBCAP1
SEQUENCE = LAUNCH,ANTS,PARK,KSC_DEORBIT,DESCENT,DONE

PARKING_ALT = 74000
LAUNCH_INCLINATION = 0

# Pre-sync the descent band at the pad — crewed reentry must
# never wait on a KSC link for its libraries.
LIBS_EXTRA = descent

# Time to spend in orbit before the return leg, in seconds from
# orbit insertion (3 hours = half a Kerbin day; set to taste, 0 =
# return on the first good pass). KAC-alarmed, warp-safe.
ORBIT_STAY_TIME = 10800

# KSC_DEORBIT targeting (the landatksc recipe). From an
# equatorial orbit the ground track crosses KSC every pass, so a
# 4-orbit window is plenty. Best pass flies even outside
# tolerance; the coarse scan result is flown without refinement.
LANDING_TARGET_LAT = -0.10
LANDING_TARGET_LNG = -74.25
LANDING_TARGET_TOLERANCE = 15000
REENTRY_PE = 30000
TARGET_DEORBIT_SCAN_ORBITS = 4
TARGET_DEORBIT_SCAN_SAMPLES = 128
TARGET_DEORBIT_COARSE_STOP_DIST = 15000
TARGET_DEORBIT_SKIP_REFINE = 1
TARGET_DEORBIT_PROCEED_ON_MISS = 1
# 300s lead: time to despin/align before the burn (flight-found
# on the scansat; harmless with a pilot aboard).
TARGET_DEORBIT_MIN_LEAD = 300

# Ride the whole stack down — enough chutes for capsule+booster,
# and the attached booster's science comes home too (the FR3
# craft default of DESCENT_DECOUPLER_TAG = none applies; tag a
# separator and set DESCENT_DECOUPLE_ALT here only if a heavier
# build needs to shed it). Attitude control drops at 38 km to
# save battery (chutes stabilize).
DESCENT_RELEASE_ALT = 38000
