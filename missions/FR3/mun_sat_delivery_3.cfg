# FR3 Mun satellite delivery contract 3.
# FIRST FLIGHT TEST of the new maneuver planning pipeline:
# BPLANE steers the arrival hyperbola onto the contract plane and
# periapsis, CAPTURE burns tangentially at Pe (preserving plane,
# Pe, and apsis line) straight to the contract apoapsis, and SHAPE
# closes out AP/PE/INC/LAN/AOP in closed form. No CIRC/INCLINE.
#
# Contract orbit at the Mun:
#   Periapsis:  95.789 km     Apoapsis: 903.586 km
#   Inclination: 138.9 deg    LAN: 51.5 deg    AoP: 269 deg
#
# What to watch in the log:
#   BPLANE[n] dBT/dBR shrinking over <=8 iterations; a "plane
#   tilted off the arrival asymptote" warning means the departure
#   window can't reach this LAN exactly — SHAPE will finish it.
#   STATS shape result solved=True within ~4 burns.
#
# Select this from the FR3 launch-pad mission picker, or set:
#   stateSet("mission_id", "mun_sat_delivery_3").

MISSION_ID = mun_sat_delivery_3
MISSION_NAME = Mun Satellite Delivery Contract 3
TARGET = MUN
PAYLOADS = SCISAT
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,XING,BPLANE,COAST,CAPTURE,SHAPE,RELAY_OPS,DONE

PARKING_ALT = 79500
LAUNCH_INCLINATION = 0

# Capture directly into the contract orbit: arrive with Pe at the
# contract periapsis on the contract plane (BPLANE), then the
# capture burn's TARGET_AP sets the contract apoapsis in one shot.
CAPTURE_PE = 95789
CAPTURE_INC = 138.9
CAPTURE_LAN = 51.5
CAPTURE_DIR = PROGRADE
# AoP guides the departure-window scan only; the exact value is
# SHAPE's job (in-plane apsidal rotation is cheap on this ellipse).
CAPTURE_AOP = 269
TRANSFER_AOP_ERR_TOL = 30
TRANSFER_AOP_SCAN_TOL = 20

TARGET_PE = 95789
TARGET_AP = 903586

# Final contract elements — SHAPE trims whatever is left.
SHAPE_AP = 903586
SHAPE_PE = 95789
SHAPE_INC = 138.9
SHAPE_LAN = 51.5
SHAPE_AOP = 269

REENTRY_PE = 35000
