# FR3 Mun satellite delivery contract 2.
# Retrograde equatorial contract orbit. The contract does not specify
# enough plane geometry for full automatic LAN/AoP alignment, so the
# profile parks in a circular capture orbit for manual node work.
#
# Target orbit:
#   Inclination: 180 deg (retrograde equatorial)
#   Argument of periapsis: 88.7 deg
#   Periapsis: 638.429 km
#   Apoapsis: 1680.681 km
#
# Select this from the FR3 launch-pad mission picker, or set:
#   stateSet("mission_id", "mun_sat_delivery_3").

MISSION_ID = mun_sat_delivery_3
MISSION_NAME = Mun Satellite Delivery Contract 3
TARGET = MUN
PAYLOADS = SCISAT
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,XING,MCC,COAST,CAPTURE,CIRC,INCLINE,RELAY_OPS,DONE

PARKING_ALT = 79500
LAUNCH_INCLINATION = 0

# Capture at target PE to minimize orbit adjustment dV
CAPTURE_PE = 15000
CAPTURE_INC = 138.9
CAPTURE_DIR = PROGRADE
CAPTURE_AOP = 269
CAPTURE_LAN = 51.5
TRANSFER_AOP_ERR_TOL = 30
TRANSFER_AOP_SCAN_TOL = 20

TARGET_PE = 95789
TARGET_AP = 903586
