# FR3 + KRBCAP1 round-the-world hop — a very long suborbital arc
# that lands back where it started.
#
# SUBORBIT_RETURN mode: the ascent keeps burning prograde just
# below orbital speed while the Trajectories impact prediction
# sweeps east around the globe; the engine cuts when the predicted
# impact arrives back at the launch site, and small trim burns
# above the atmosphere center it (SUBORBIT_RETURN_TOL). Maximum
# time in space without going orbital; lands ~at KSC. Needs the
# Trajectories mod and clearly more dV than the plain hop —
# near-orbital speed plus margin.
#
# VAB prep matches krbcap1_suborbital (chutes; separator tagged
# descent_decoupler).

MISSION_ID = krbcap1_suborbital_ksc
MISSION_NAME = KRBCAP1 Round-the-World Hop
TARGET = KERBIN
PAYLOADS = KRBCAP1
SEQUENCE = LAUNCH,SUBORBIT,DESCENT,DONE

PARKING_ALT = 74000
LAUNCH_INCLINATION = 0
SUBORBIT_RETURN = 1
SUBORBIT_RETURN_TOL = 40000

# Pre-sync the descent band at the pad: the SUBORBIT -> DESCENT
# band change can happen with no KSC link (antennas in, plasma,
# horizon) and a crewed reentry must never wait on a sync
# (flight-found: phaseAerobrake undefined on a no-link reboot).
LIBS_EXTRA = suborbit@SUBORBIT, descent

# Shed the booster on descent, before the chutes.
DESCENT_DECOUPLER_TAG = descent_decoupler
DESCENT_DECOUPLE_ALT = 29
DESCENT_RELEASE_ALT = 38000
