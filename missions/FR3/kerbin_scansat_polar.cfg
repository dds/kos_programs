# FR3 Kerbin SCANsat polar mapper.
# Launch to a 350 km polar mapping orbit, release the mapper
# there, then dispose the carrier into the atmosphere.
#
# Tune TARGET_PE/AP to the scanner's ideal altitude band (most
# SCANsat parts map Kerbin well from 250-500 km).
#
# Select this from the FR3 launch-pad mission picker, or set:
#   stateSet("mission_id", "kerbin_scansat_polar").

MISSION_ID = kerbin_scansat_polar
MISSION_NAME = Kerbin SCANsat Polar Mapper
TARGET = KERBIN
PAYLOADS = SCANSAT
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,CIRC,RAISE,INCLINE,SCANSAT_OPS,DONE

PARKING_ALT = 85000
LAUNCH_INCLINATION = 90
TARGET_PE = 350000
TARGET_AP = 350000
TARGET_INCLINATION = 90

# Release the mapper in the target orbit, then deorbit the
# carrier (Pe into the atmosphere burns it up).
SCANSAT_DECOUPLER_TAG = scansat_decoupler
SCANSAT_DISPOSE_CARRIER = 1
SCANSAT_DISPOSE_PE = 30000
SCANSAT_DISPOSE_MAX_TIME = 600
SCANSAT_CLEARANCE_DV = 2
SCANSAT_CLEARANCE_DIR = NORMAL
SCANSAT_CLEARANCE_THROTTLE = 0.25
SCANSAT_CLEARANCE_SETTLE = 3
