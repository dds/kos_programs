# FR3 Kerbin orbital payload delivery sample.
# Randomly selected contract-style orbital elements:
#   LAN: 256.0 deg
#   AoP: 153.6 deg
#
# This is intentionally an inclined elliptical orbit so both LAN and AoP
# are meaningful. Circular or equatorial orbits make one of those angles
# poorly defined.
#
# Select this from the FR3 launch-pad mission picker, or set:
#   stateSet("mission_id", "kerbin_aop_lan_sample").
#
# Current support notes:
#   * PRELAUNCH waits for KSC to rotate under the target LAN plane.
#   * LAUNCH_INCLINATION gives MechJeb the desired ascent inclination.
#   * CAPTURE_AOP is used by the orbit finalization trim.

MISSION_ID = kerbin_aop_lan_sample
MISSION_NAME = Kerbin AoP/LAN Payload Sample
TARGET = KERBIN
PAYLOADS = SCISAT
SEQUENCE = PRELAUNCH,LAUNCH,FAIR,ANTS,PARK,CIRC,RAISE,INCLINE,ELLIPTICAL,RELAY_OPS,DONE

PARKING_ALT = 73500
LAUNCH_INCLINATION = 37
PRELAUNCH_PLANE_LEAD = 145

TARGET_PE = 180000
TARGET_AP = 950000
TARGET_INCLINATION = 37
CAPTURE_INC = 37
CAPTURE_LAN = 256.0
CAPTURE_AOP = 153.6

INCL_TOLERANCE = 0.05
MAX_INCL_CHANGE_DV = 250
ELLIPTICAL_MAX_NODE_DV = 350
