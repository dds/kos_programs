# FR3 point-landing delivery — launch, orbit, then land at picked
# coordinates anywhere the orbit can reach.
#
# The KSC_DEORBIT phase is the generic targeted deorbit: it flies
# to LANDING_TARGET_WAYPOINT when set (create a custom waypoint in
# Waypoint Manager and put its name here), otherwise to
# LANDING_TARGET_LAT/LNG. Copy this file per contract or edit in
# place.
#
# Reachability: the orbit must overfly the target —
# LAUNCH_INCLINATION must be >= |target latitude| (the phase
# checks and holds rather than scanning forever).
#
# Already in orbit? cmd/landat.ks does the same delivery without
# a launch: select a waypoint in Waypoint Manager and
#   RUNPATH('0:/cmd/landat.ks').

MISSION_ID = point_landing
MISSION_NAME = Point Landing Delivery
TARGET = KERBIN
PAYLOADS = KRBCAP1
SEQUENCE = LAUNCH,ANTS,PARK,KSC_DEORBIT,DESCENT,DONE

PARKING_ALT = 73500
LAUNCH_INCLINATION = 0

# Pre-sync the descent band at the pad — reentry must never wait
# on a KSC link for its libraries.
LIBS_EXTRA = descent

# Target: waypoint name wins; lat/lng is the fallback.
# LANDING_TARGET_WAYPOINT = Drop Zone
LANDING_TARGET_LAT = -0.10
LANDING_TARGET_LNG = -74.25
LANDING_TARGET_TOLERANCE = 15000
REENTRY_PE = 30000
TARGET_DEORBIT_SCAN_ORBITS = 4
TARGET_DEORBIT_SCAN_SAMPLES = 128
TARGET_DEORBIT_COARSE_STOP_DIST = 15000
TARGET_DEORBIT_SKIP_REFINE = 1
TARGET_DEORBIT_PROCEED_ON_MISS = 1
TARGET_DEORBIT_MIN_LEAD = 90

# Shed the booster on descent, before the chutes.
DESCENT_DECOUPLER_TAG = descent_decoupler
DESCENT_DECOUPLE_ALT = 45000
