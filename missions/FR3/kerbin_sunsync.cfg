# FR3 Kerbin sun-synchronous satellite mission profile.
# Retrograde near-polar orbit at ~700 km altitude, 98 deg inclination.
#
# NOTE: Stock KSP Kerbin has no J2 oblateness, so there is no actual
# nodal precession for a true sun-synchronous effect. This profile
# delivers a satellite to the specified retrograde polar orbit.
# With Principia or RSS, the J2 effect applies at these parameters.
#
# Tune TARGET_PE / TARGET_AP (500000-900000 m) and
# TARGET_INCLINATION (96-102 deg) to match your contract.
#
# Select this from the FR3 launch-pad mission picker, or set:
#   stateSet("mission_id", "kerbin_sunsync").

MISSION_ID = kerbin_sunsync
MISSION_NAME = Kerbin Sun-Sync Satellite
TARGET = KERBIN
PAYLOADS = SCISAT
SEQUENCE = LAUNCH,FAIR,ANTS,PARK,CIRC,RAISE,INCLINE,RELAY_OPS,DONE

PARKING_ALT = 83000
LAUNCH_INCLINATION = 98
TARGET_PE = 700000
TARGET_AP = 700000
TARGET_INCLINATION = 98
