# FR3 + KRBCAP1 crewed suborbital hop — first Kerbal flight.
# MechJeb flies the ascent until apoapsis reaches PARKING_ALT,
# then SUBORBIT cuts the engine (no circularization) and the
# capsule falls back for a chute landing downrange.
#
# VAB prep on the KRBCAP1 stack (~1000 kg, same class as the
# science payload):
#   - chutes on the capsule (untagged is fine — DESCENT arms all
#     chutes when no descent_chutes tag is found)
#   - tag the capsule/booster separator "descent_decoupler" so
#     the spent lifter is shed high on the way down (see
#     DESCENT_DECOUPLE_ALT below). Remove that line to ride the
#     whole stack down instead.
#
# Select from the FR3 launch-pad mission picker, or set:
#   stateSet("mission_id", "krbcap1_suborbital").

MISSION_ID = krbcap1_suborbital
MISSION_NAME = KRBCAP1 Suborbital Hop
TARGET = KERBIN
PAYLOADS = KRBCAP1
SEQUENCE = LAUNCH,SUBORBIT,DESCENT,DONE

PARKING_ALT = 80000
LAUNCH_INCLINATION = 0

# Pre-sync the descent band at the pad — crewed reentry must
# never wait on a KSC link for its libraries.
LIBS_EXTRA = suborbit, descent

# Shed the booster while falling back through 35 km, well before
# the chutes. Overrides the FR3 craft default of "none".
#DESCENT_DECOUPLER_TAG = descent_decoupler
#DESCENT_DECOUPLE_ALT = 45000
