# FR3 + KRBCAP1 LKO rescue — pick up a stranded kerbal and bring
# them home to KSC.
#
# Target the stranded ship in map view BEFORE launching (or set
# RENDEZVOUS_TARGET below): PRELAUNCH grabs the game target,
# persists it, and computes the launch window from the target's
# own orbit — waiting until the launch site rotates into the
# target's plane AND the target is positioned so it sits just
# ahead of us at insertion. RDV plans the Hohmann catch-up, MATCH
# brakes at closest approach and closes to EVA range (~150m), and
# CREW_XFER holds until the rescued kerbal boards.
# Then the proven KSC deorbit + descent brings everyone home.
#
# The KRBCAP1 needs an empty seat.
#
# Knobs: LAUNCH_RDV_LEAD (deg ahead of the site at insertion, 30),
# LAUNCH_RDV_ASCENT_TIME (300s), LAUNCH_RDV_MAX_WINDOWS (16),
# MATCH_FINAL_DIST (150m).

MISSION_ID = rescue_lko
MISSION_NAME = LKO Rescue
TARGET = KERBIN
PAYLOADS = KRBCAP1
SEQUENCE = PRELAUNCH,LAUNCH,ANTS,PARK,RDV,MATCH,CREW_XFER,KSC_DEORBIT,DESCENT,DONE

PARKING_ALT = 73500
# RENDEZVOUS_TARGET = Ship Name Here   (or just target it in map view)

# launch: PRELAUNCH is its own band now, and the ascent must
# start the moment the rendezvous window opens — no reboot prompt
# at the window. descent: crewed reentry must never wait on a
# KSC link for its libraries.
LIBS_EXTRA = launch@PARK, descent

# Return leg (the landatksc recipe, offshore KSC).
LANDING_TARGET_LAT = -0.10
LANDING_TARGET_LNG = -74.25
LANDING_TARGET_TOLERANCE = 15000
REENTRY_PE = 30000
TARGET_DEORBIT_SCAN_ORBITS = 4
TARGET_DEORBIT_SCAN_SAMPLES = 128
TARGET_DEORBIT_COARSE_STOP_DIST = 15000
TARGET_DEORBIT_SKIP_REFINE = 1
TARGET_DEORBIT_PROCEED_ON_MISS = 1
TARGET_DEORBIT_MIN_LEAD = 90

# Shed the booster on descent, before the chutes.
DESCENT_DECOUPLER_TAG = descent_decoupler
DESCENT_DECOUPLE_ALT = 45000
