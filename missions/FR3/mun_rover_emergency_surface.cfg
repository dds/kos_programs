# FR3 Mun rover emergency profile.
# Use when the rover tank is leaking and the second stage must soft-land
# the whole stack, release the rover on the surface, and let rover torque
# recover onto its wheels.

MISSION_ID = mun_rover_emergency_surface
MISSION_NAME = Mun Rover Emergency Surface Release
TARGET = MUN
PAYLOADS = ASSISTROVER
PROGRESSIVE_RELOAD = 1

SEQUENCE = LUNCH,FAIR,ANTS,PARK,XING,MCC,COAST,CAPTURE,CIRC,RAISE,INCLINE,LAND_DEORBIT,LAND_ASSIST,ROVER,DONE

PARKING_ALT = 80000
LAUNCH_INCLINATION = 0
FAIRING_ALT = 71500
EXTEND_ALT = 73000
CAPTURE_PE = 15000
CAPTURE_INC = 90
CAPTURE_DIR = POLAR
TARGET_PE = 20000
TARGET_AP = 20000
TARGET_INCLINATION = 90

RELOAD_AFTER_PARK = 1
LANDING_DEORBIT_PE = -5000
LANDING_TARGET_TOLERANCE = 2500
LANDING_GUIDANCE_ALT = 5000
TARGET_DEORBIT_SCAN_ORBITS = 32
TARGET_DEORBIT_SCAN_SAMPLES = 2048
TARGET_DEORBIT_COARSE_STOP_DIST = 4000
TARGET_DEORBIT_REFINE_TOLERANCE = 250
TARGET_DEORBIT_PROCEED_ON_MISS = 0
LANDING_SITE_SCAN_ENABLE = 1
LANDING_SITE_SCAN_RADIUS = 1500
LANDING_SITE_SCAN_STEP = 250
LANDING_SITE_MAX_SLOPE = 12

# Emergency carrier landing mode.
LANDING_ASSIST_RELEASE_ON_SURFACE = 1
LANDING_ASSIST_DESCENT_SPEED = 35
LANDING_ASSIST_MAX_TILT = 12
LANDING_ASSIST_SURFACE_BRAKE_HSPEED = 80
LANDING_ASSIST_SURFACE_BRAKE_THROTTLE = 1
LANDING_ASSIST_SURFACE_BRAKE_LEAD = 15
LANDING_ASSIST_SURFACE_BRAKE_MARGIN = 600
LANDING_ASSIST_SURFACE_FINAL_SPEED = 0.8
LANDING_ASSIST_SURFACE_SETTLE_TIME = 5
LANDING_ASSIST_SURFACE_TIPOVER = 1
LANDING_ASSIST_SURFACE_TIP_TIME = 4

# Reboot after rover release so only rover code is loaded.
RELOAD_AFTER_LAND_ASSIST = 1
RELOAD_AFTER_LAND = 0
