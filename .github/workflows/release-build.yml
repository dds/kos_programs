name: Release build

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attach-build:
    name: Attach build bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Build release bundle
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "release" ]; then
            tag="${RELEASE_TAG}"
          else
            tag="${REF_NAME}-${GIT_SHA:0:12}"
          fi

          safe_tag="${tag//\//-}"
          bundle_name="kos_programs-${safe_tag}"

          mkdir -p dist-existing
          if [ "${EVENT_NAME}" = "release" ] && gh release download "${tag}" --pattern VERSION --dir dist-existing --clobber >/dev/null 2>&1 && [ -s dist-existing/VERSION ]; then
            build_version="$(tr -d '\r\n' < dist-existing/VERSION)"
          else
            build_version="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          fi

          mkdir -p "dist/${bundle_name}"
          git archive HEAD | tar -x -C "dist/${bundle_name}"
          printf '%s\n' "${build_version}" > "dist/${bundle_name}/VERSION"
          cp "dist/${bundle_name}/VERSION" dist/VERSION
          tar -czf "dist/${bundle_name}.tar.gz" -C dist "${bundle_name}"

          {
            echo "build_version=${build_version}"
            echo "bundle=dist/${bundle_name}.tar.gz"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload release assets
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "${{ steps.build.outputs.bundle }}" \
            dist/VERSION \
            --clobber

      - name: Upload workflow artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: kos-programs-build
          path: |
            ${{ steps.build.outputs.bundle }}
            dist/VERSION
          retention-days: 30

      - name: Summarize build
        shell: bash
        run: |
          {
            echo "### Release build"
            echo
            echo "- Build UUID: \`${{ steps.build.outputs.build_version }}\`"
            echo "- Bundle: \`${{ steps.build.outputs.bundle }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
