// Local Steam Deck overrides. Copy this file to:
// ~/Kerbal Space Program/GameData/zzz_DeckTweaks/DeckMemory.cfg
// Restart KSP completely after installing or changing it.
// This file is not installed automatically by kOS boot/sync.

@KSPTextureLoader:FINAL
{
    // Allow the existing upload buffer to be released while idle.
    %AsyncUploadPersistentBuffer = False
    // Temporary asynchronous loading budget in MB, not a total RAM cap.
    %MaxTextureLoadMemory = 256
}

@Deferred:FINAL
{
    @Deferred_config
    {
        // Keep Deferred lighting/probes; omit screen-space reflections.
        %useScreenSpaceReflections = False
    }
}
